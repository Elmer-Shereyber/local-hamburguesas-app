<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ticket {
            background: #fff;
            width: 300px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 14px;
            color: #000;
        }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-left { text-align: left; }
        .bold { font-weight: bold; }
        .mb-1 { margin-bottom: 10px; }
        .mt-1 { margin-top: 10px; }
        .divider {
            border-top: 1px dashed #000;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            vertical-align: top;
            padding: 3px 2px;
        }
        th.right, td.right {
            text-align: right;
        }
        
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            width: 300px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            font-family: sans-serif;
        }
        .btn-print { background: #007bff; color: white; }
        .btn-print:hover { background: #0056b3; }
        .btn-next { background: #28a745; color: white; }
        .btn-next:hover { background: #218838; }

        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .ticket {
                box-shadow: none;
                width: 100%;
                max-width: 300px;
                padding: 0;
            }
            .actions {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="ticket" id="ticket-content">
        <p class="text-center">Cargando comprobante...</p>
    </div>

    <div class="actions">
        <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir</button>
        <a href="registrar-pedido.html" class="btn btn-next">Nuevo Pedido</a>
    </div>

    <script type="module" src="comprobante.js"></script>
</body>
</html>
