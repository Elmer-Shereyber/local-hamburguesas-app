<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pedido - Cajera</title>
    <link rel="stylesheet" href="../css/styles.css">

</head>
<body>
    <header>
        <h1>Burger Local - Cajera</h1>
        <div class="user-info">
            <span id="current-user"></span>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </header>
    
    <nav>
        <ul>
            <li><a href="registrar-pedido.html" class="active">Registrar Pedido</a></li>
            <li><a href="consultar-pedidos.html">Consultar Pedidos</a></li>
        </ul>
    </nav>

    <div class="container grid-2" style="grid-template-columns: 2fr 1fr;">
        <!-- Catálogo -->
        <div class="card">
            <h2>Catálogo de Productos</h2>
            <div id="productos-grid" class="product-grid">
                <p>Cargando productos...</p>
            </div>
        </div>

        <!-- Carrito -->
        <div class="card">
            <h2>Pedido Actual</h2>
            <div id="carrito-container" style="min-height: 200px;">
                <p class="text-center" style="color: #666; margin-top: 2rem;">Agrega productos al pedido</p>
            </div>
            
            <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border-color);">
            
            <div class="d-flex justify-between" style="font-size: 1.2rem; font-weight: bold;">
                <span>Total:</span>
                <span id="total-monto">S/ 0.00</span>
            </div>

            <div class="form-group mt-1">
                <label for="detalle-pedido">Detalle <span style="font-weight: normal; color: var(--text-muted); font-size: 0.85em;">(Opcional, máx 300 car.)</span></label>
                <textarea id="detalle-pedido" maxlength="300" rows="3" placeholder="Ej. 1 Hamburguesa sin cremas, 1 Salchipapa sin mostaza, para llevar..."></textarea>
                <div style="text-align: right; font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">
                    <span id="detalle-counter">0</span> / 300 caracteres
                </div>
            </div>

            <div class="form-group">
                <label for="modalidad-pago">Modalidad de Pago</label>
                <select id="modalidad-pago">
                    <option value="">Seleccione...</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Yape">Yape</option>
                    <option value="Plin">Plin</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Híbrido">Híbrido</option>
                </select>
            </div>

            <div id="hibrido-container" style="display: none; background: var(--bg-main); padding: 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; border: 1px solid var(--border-color);">
                <div class="d-flex justify-between align-center" style="margin-bottom: 0.75rem;">
                    <span style="font-size: 0.88rem; font-weight: 700; color: var(--text-main);">Distribución de Pago Híbrido</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">2 o más medios</span>
                </div>

                <div class="hibrido-grid">
                    <div class="hibrido-item">
                        <label for="hibrido-efectivo">💵 Efectivo</label>
                        <div class="input-prefix">
                            <span>S/</span>
                            <input type="number" class="hibrido-input" id="hibrido-efectivo" min="0" step="0.01" value="0">
                        </div>
                    </div>
                    <div class="hibrido-item">
                        <label for="hibrido-yape">📱 Yape</label>
                        <div class="input-prefix">
                            <span>S/</span>
                            <input type="number" class="hibrido-input" id="hibrido-yape" min="0" step="0.01" value="0">
                        </div>
                    </div>
                    <div class="hibrido-item">
                        <label for="hibrido-plin">📲 Plin</label>
                        <div class="input-prefix">
                            <span>S/</span>
                            <input type="number" class="hibrido-input" id="hibrido-plin" min="0" step="0.01" value="0">
                        </div>
                    </div>
                    <div class="hibrido-item">
                        <label for="hibrido-transferencia">🏦 Transf.</label>
                        <div class="input-prefix">
                            <span>S/</span>
                            <input type="number" class="hibrido-input" id="hibrido-transferencia" min="0" step="0.01" value="0">
                        </div>
                    </div>
                </div>

                <div id="hibrido-feedback" style="margin-top: 0.85rem; padding: 0.65rem 0.75rem; border-radius: var(--radius-md); text-align: center; border: 1px solid transparent; transition: all var(--transition-fast);">
                    <!-- Mensaje dinámico calculado en tiempo real -->
                </div>
            </div>

            <button id="btn-registrar" class="btn btn-primary" style="width: 100%;" disabled>Ir a Emitir Comprobante</button>
        </div>
    </div>
    
    <script type="module" src="registrar-pedido.js"></script>
</body>
</html>
